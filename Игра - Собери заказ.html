<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Собери заказ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Onest:wght@400;500;600;700&family=Caveat:wght@700&display=swap">
<script src="./game-orders.js"></script>
<script src="./translations.js"></script>
<script src="./fl-lang.js"></script>
<style>
:root{--deep:#173F6B;--lagoon:#2C6BA8;--sky:#9CCBF5;--foam:#EEF5FC;--ink:#13263F;--muted:#5B6E86;--line:#D6E4F2;--ok:#1F7A4D;--bad:#C0392B;--grab:#00B14F;--gojek:#EE2737}
*{box-sizing:border-box}
body{margin:0;background:var(--foam);color:var(--ink);font:400 15px/1.5 "Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:20px 14px 80px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{flex:none;width:48px;height:48px;border-radius:14px;overflow:hidden;background:#FBF3E4;box-shadow:0 8px 18px -10px rgba(20,53,89,.55)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand{flex:1;min-width:150px}.brand small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--lagoon)}
.brand b{font:800 21px "Nunito",sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:600 13.5px "Onest",sans-serif;text-decoration:none;cursor:pointer;transition:transform .12s ease,border-color .15s}
.btn:hover{border-color:var(--sky)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:700}
.btn.big{min-height:50px;font-size:16px;padding:0 22px;border-radius:14px}
.lang{display:inline-flex;gap:3px;padding:3px;background:#fff;border:1px solid var(--line);border-radius:99px}
.lang button{border:0;background:none;border-radius:99px;padding:6px 10px;font:600 12px "Onest",sans-serif;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--deep);color:#fff}
.hero{position:relative;overflow:hidden;background:linear-gradient(155deg,#1E5590,#143559);color:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 40px -28px rgba(20,53,89,.9)}
.hero .hw{font:700 25px/1 "Caveat",cursive;color:var(--sky)}
.hero h1{margin:6px 0 8px;font:800 28px/1.12 "Nunito",sans-serif}
.hero p{margin:0;color:rgba(255,255,255,.86);max-width:62ch}
.score{display:inline-flex;gap:8px;margin-top:14px;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 14px;font-weight:700}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.oc{position:relative;text-align:left;background:#fff;border:1.5px solid transparent;border-radius:20px;padding:14px;cursor:pointer;box-shadow:0 16px 28px -24px rgba(20,53,89,.6);display:flex;flex-direction:column;gap:8px;transition:transform .16s ease,border-color .16s;animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.oc:hover{transform:translateY(-3px);border-color:var(--sky)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.oc .hd{display:flex;align-items:center;gap:10px}
.oc img{width:42px;height:42px;border-radius:99px;object-fit:cover;background:#FBF3E4;flex:none}
.oc .n{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lagoon)}
.oc b{font:800 16px/1.2 "Nunito",sans-serif}
.oc .ln{font-size:13px;color:var(--muted)}
.oc .st{position:absolute;right:12px;top:12px;font-size:15px;letter-spacing:1px}
.note{display:inline-block;background:#FFF4D6;color:#7A5300;border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:600}
.play{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.play>*{min-width:0}
@media (max-width:820px){.play{grid-template-columns:1fr}.ticket{position:static !important}}
.ticket{position:sticky;top:10px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 18px 30px -24px rgba(20,53,89,.6)}
.ticket .app{color:#fff;font:800 15px "Nunito",sans-serif;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.ticket .body{padding:12px 14px 14px;font-family:"Onest",monospace}
.ticket .row{padding:5px 0;border-bottom:1px dashed var(--line);font-weight:600}
.ticket .cat{margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ticket .catn{margin-top:4px;background:#FFF4D6;border-radius:10px;padding:8px 10px;font-weight:700;color:#5A3D00}
.ticket .catn small{display:block;font-weight:500;color:#7A5300;margin-top:2px}
.timer{font:700 13px "Onest",sans-serif;color:var(--muted)}
.panel{background:#fff;border-radius:18px;padding:14px;box-shadow:0 18px 30px -24px rgba(20,53,89,.6)}
.trays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.trays{gap:6px}.tray{padding:7px;min-height:96px}.tray h4{flex-direction:column;align-items:flex-start;font-size:12.5px}.tray h4 span{font-size:10px}.chipz button{font-size:11px;padding:4px 7px}.panel{padding:10px}}
.tray{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:120px;cursor:pointer;transition:border-color .15s,background .15s}
.tray.on{border-color:var(--lagoon);border-style:solid;background:#F5FAFF}
.tray h4{margin:0 0 6px;font:800 14px "Nunito",sans-serif;display:flex;justify-content:space-between;align-items:center}
.tray h4 span{font:600 11px "Onest",sans-serif;color:var(--lagoon)}
.chipz{display:flex;flex-wrap:wrap;gap:5px}
.chipz button{border:0;background:var(--foam);border-radius:99px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.chipz button.new{animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
.chipz button:hover{background:#FDE4E1}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.empty{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ing{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:transform .14s cubic-bezier(.3,1.6,.5,1),border-color .15s}
.ing:hover{transform:translateY(-2px) rotate(-2deg);border-color:var(--sky)}
.ing:active{transform:scale(.92)}
.ing .e{font-size:32px;line-height:1.1}
.ing small{font-size:11.5px;font-weight:600;line-height:1.2}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.res{position:fixed;inset:0;background:rgba(10,25,45,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.res .box{background:#fff;border-radius:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.res h2{margin:0;font:800 24px "Nunito",sans-serif}
.stars{font-size:38px;letter-spacing:4px;margin:6px 0}
.list{margin:10px 0;padding:0;list-style:none}
.list li{padding:7px 10px;border-radius:10px;margin-bottom:5px;font-size:14px}
.list li.ok{background:#E6F4EC;color:var(--ok)}
.list li.bad{background:#FDE4E1;color:#8E2B20}
.tip{background:var(--foam);border-radius:12px;padding:10px 12px;font-size:13.5px}
.gate{background:#fff;border-radius:20px;padding:22px;text-align:center}
@media (prefers-reduced-motion:reduce){.oc,.chipz button,.res .box{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="Академия.dc.html"><img src="assets/brands/foodlab.png" alt="Food Lab"></a>
    <div class="brand"><small>Food Lab Academy</small><b>Собери заказ</b></div>
    <a class="btn" href="Академия.dc.html">← Академия</a>
    <span class="lang" role="group" aria-label="Language"><button type="button" data-l="ru">RU</button><button type="button" data-l="id">ID</button><button type="button" data-l="en">EN</button></span>
  </div>
  <div id="app"></div>
</div>
<script>
(function () {
  var SHELF = window.FL_GAME_SHELF || [], ORDERS = window.FL_GAME_ORDERS || [];
  var ITEM = {}, IS_DRINK = {};
  SHELF.forEach(function (t, ti) { t.items.forEach(function (it) { ITEM[it[0]] = { e: it[1], ru: it[2] }; if (t.tab === 'Напитки') IS_DRINK[it[0]] = 1; }); });
  var ZONES = [['main', 'В блюдо / бокс', 'основное'], ['side', 'Отдельно', 'соусник, контейнер'], ['drink', 'К заказу', 'напитки, сахар']];
  var ZONE_RU = { main: 'в блюдо', side: 'отдельно', drink: 'к заказу' };
  var app = document.getElementById('app');
  var BKEY = 'foodlab-game-best';
  var best = {};
  try { best = JSON.parse(localStorage.getItem(BKEY) || '{}'); } catch (e) {}
  var st = null, timer = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function stars(n) { var s = ''; for (var i = 0; i < 3; i++) s += i < n ? '★' : '☆'; return s; }
  function total() { var t = 0; for (var k in best) t += best[k]; return t; }

  // ── Список заказов ─────────────────────────────────────────────────────
  function home() {
    clearInterval(timer);
    app.innerHTML = '<div class="hero"><div class="hw">Новый заказ!</div><h1>Собери заказ по чеку</h1>' +
      '<p>Приходит заказ из Grab или Gojek. Прочитай чек и заметку гостя, собери всё на поднос и отдай. Смотри внимательно: «dipisah» — отдельно, «tanpa» — без, «extra» и «tambah» — добавить.</p>' +
      '<div class="score">⭐ ' + total() + ' из ' + ORDERS.length * 3 + '</div></div>' +
      '<div class="orders">' + ORDERS.map(function (o, i) {
        return '<button class="oc" data-o="' + i + '" style="animation-delay:' + i * 40 + 'ms"><span class="st">' + (best[i] != null ? stars(best[i]) : '') + '</span>' +
          '<div class="hd"><img src="assets/brands/' + o.brand + '.png" alt=""><div><div class="n">Заказ ' + (i + 1) + ' · ' + esc(o.brandName) + '</div><b>' + esc(o.lines[0].replace(/^1× /, '')) + '</b></div></div>' +
          '<div class="ln">' + esc(o.lines.length > 1 ? 'и ещё ' + (o.lines.length - 1) + ' поз.' : '1 позиция') + '</div>' +
          '<span class="note">📝 ' + esc(o.noteRu) + '</span></button>';
      }).join('') + '</div>';
    [].forEach.call(app.querySelectorAll('[data-o]'), function (b) {
      b.addEventListener('click', function () { start(+b.getAttribute('data-o')); });
    });
  }

  // ── Игра ───────────────────────────────────────────────────────────────
  function start(i) {
    st = { i: i, zone: 'main', tab: 0, tray: { main: {}, side: {}, drink: {} }, t0: Date.now() };
    play();
    clearInterval(timer);
    timer = setInterval(function () {
      var el = document.getElementById('tm');
      if (el) { var s = Math.floor((Date.now() - st.t0) / 1000); el.textContent = '⏱ ' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
    }, 1000);
  }
  function play() {
    var o = ORDERS[st.i];
    var grab = o.app === 'GrabFood';
    var html = '<div class="play"><div class="ticket"><div class="app" style="background:' + (grab ? 'var(--grab)' : 'var(--gojek)') + '"><span>' + o.app + '</span><span>' + o.id + '</span></div>' +
      '<div class="body"><div style="display:flex;justify-content:space-between;align-items:center"><b>' + esc(o.brandName) + '</b><span class="timer" id="tm">⏱ 0:00</span></div>' +
      '<div class="cat">Produk yang dipesan</div>' + o.lines.map(function (l) { return '<div class="row" data-fl-keep>' + esc(l) + '</div>'; }).join('') +
      '<div class="cat" data-fl-keep>Catatan Pesanan</div><div class="catn"><span data-fl-keep>' + esc(o.note) + '</span><small>' + esc(o.noteRu) + '</small></div></div></div>';
    html += '<div class="panel"><div class="trays">' + ZONES.map(function (z) {
      var items = st.tray[z[0]], keys = Object.keys(items);
      return '<div class="tray' + (st.zone === z[0] ? ' on' : '') + '" data-z="' + z[0] + '"><h4>' + z[1] + '<span>' + (st.zone === z[0] ? 'сюда кладём' : z[2]) + '</span></h4><div class="chipz">' +
        (keys.length ? keys.map(function (k) { return '<button' + (st.last === z[0] + '|' + k ? ' class="new"' : '') + ' data-rm="' + z[0] + '|' + k + '" title="Убрать">' + ITEM[k].e + ' ' + esc(ITEM[k].ru) + (items[k] > 1 ? ' ×' + items[k] : '') + '</button>'; }).join('') : '<span class="empty">пусто</span>') +
        '</div></div>';
    }).join('') + '</div>';
    html += '<div class="tabs">' + SHELF.map(function (t, ti) { return '<button data-t="' + ti + '" aria-pressed="' + (st.tab === ti) + '">' + esc(t.tab) + '</button>'; }).join('') + '</div>';
    html += '<div class="shelf">' + SHELF[st.tab].items.map(function (it) {
      return '<button class="ing" data-add="' + it[0] + '"><span class="e">' + it[1] + '</span><small>' + esc(it[2]) + '</small></button>';
    }).join('') + '</div>';
    html += '<div class="actions"><button class="btn" id="back">← Все заказы</button><button class="btn" id="clear">Очистить</button><button class="btn primary big" id="done">Отдать заказ ✓</button></div></div></div>';
    app.innerHTML = html;
    [].forEach.call(app.querySelectorAll('[data-z]'), function (el) { el.addEventListener('click', function (e) { if (e.target.closest('[data-rm]')) return; st.zone = el.getAttribute('data-z'); st.last = ''; play(); }); });
    [].forEach.call(app.querySelectorAll('[data-rm]'), function (el) {
      el.addEventListener('click', function () {
        var p = el.getAttribute('data-rm').split('|'), z = st.tray[p[0]];
        z[p[1]]--; if (z[p[1]] <= 0) delete z[p[1]]; st.last = ''; play();
      });
    });
    [].forEach.call(app.querySelectorAll('[data-t]'), function (el) { el.addEventListener('click', function () { st.tab = +el.getAttribute('data-t'); st.last = ''; play(); }); });
    [].forEach.call(app.querySelectorAll('[data-add]'), function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-add');
        var z = IS_DRINK[id] ? 'drink' : (st.zone === 'drink' ? 'main' : st.zone);
        st.tray[z][id] = (st.tray[z][id] || 0) + 1; st.last = z + '|' + id; play();
      });
    });
    document.getElementById('back').addEventListener('click', home);
    document.getElementById('clear').addEventListener('click', function () { st.tray = { main: {}, side: {}, drink: {} }; play(); });
    document.getElementById('done').addEventListener('click', check);
    var s = Math.floor((Date.now() - st.t0) / 1000);
    document.getElementById('tm').textContent = '⏱ ' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
  }

  // ── Проверка ───────────────────────────────────────────────────────────
  function check() {
    clearInterval(timer);
    var o = ORDERS[st.i], need = o.need, got = st.tray, good = [], bad = [];
    var ids = {};
    ['main', 'side', 'drink'].forEach(function (z) { Object.keys(need[z] || {}).forEach(function (k) { ids[k] = 1; }); Object.keys(got[z]).forEach(function (k) { ids[k] = 1; }); });
    Object.keys(ids).forEach(function (k) {
      var nm = ITEM[k].e + ' ' + ITEM[k].ru;
      if (o.no.indexOf(k) >= 0) {
        var put = (got.main[k] || 0) + (got.side[k] || 0) + (got.drink[k] || 0);
        if (put) bad.push(nm + ' — гость просил без этого'); else good.push(nm + ' — не положили, как просил гость');
        return;
      }
      var wantT = 0, gotT = 0, zoneOk = true;
      ['main', 'side', 'drink'].forEach(function (z) {
        var w = (need[z] || {})[k] || 0, g = got[z][k] || 0;
        wantT += w; gotT += g; if (w !== g) zoneOk = false;
      });
      if (zoneOk) { good.push(nm + (wantT > 1 ? ' ×' + wantT : '')); return; }
      if (wantT === gotT && wantT > 0) {
        var wz = ['main', 'side', 'drink'].filter(function (z) { return (need[z] || {})[k]; })[0];
        bad.push(nm + ' — нужно положить ' + ZONE_RU[wz]);
      } else if (!wantT) bad.push(nm + ' — лишнее, этого нет в заказе');
      else if (gotT < wantT) bad.push(nm + ' — не хватает: нужно ' + wantT + ', положено ' + gotT);
      else bad.push(nm + ' — слишком много: нужно ' + wantT + ', положено ' + gotT);
    });
    var n = bad.length === 0 ? 3 : bad.length === 1 ? 2 : bad.length === 2 ? 1 : 0;
    if (best[st.i] == null || n > best[st.i]) { best[st.i] = n; try { localStorage.setItem(BKEY, JSON.stringify(best)); } catch (e) {} }
    var s = Math.floor((Date.now() - st.t0) / 1000);
    var title = n === 3 ? 'Идеально! Заказ собран верно' : n === 2 ? 'Почти! Одна ошибка' : n === 1 ? 'Неплохо, но есть ошибки' : 'Гость будет недоволен';
    var box = document.createElement('div');
    box.className = 'res';
    box.innerHTML = '<div class="box"><h2>' + title + '</h2><div class="stars">' + stars(n) + '</div><div class="timer">Время: ' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2) + '</div>' +
      '<ul class="list">' + bad.map(function (x) { return '<li class="bad">✗ ' + esc(x) + '</li>'; }).join('') + good.map(function (x) { return '<li class="ok">✓ ' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<div class="tip">💡 ' + esc(o.tip) + '</div>' +
      '<div class="actions"><button class="btn" id="r-list">Все заказы</button><button class="btn" id="r-again">Ещё раз</button>' +
      (st.i < ORDERS.length - 1 ? '<button class="btn primary" id="r-next">Следующий заказ →</button>' : '') + '</div></div>';
    document.body.appendChild(box);
    function close() { box.remove(); }
    box.querySelector('#r-list').addEventListener('click', function () { close(); home(); });
    box.querySelector('#r-again').addEventListener('click', function () { close(); start(st.i); });
    var nx = box.querySelector('#r-next');
    if (nx) nx.addEventListener('click', function () { close(); start(st.i + 1); });
  }

  // ── Язык и вход ────────────────────────────────────────────────────────
  var lang = 'ru';
  try { lang = localStorage.getItem('foodlab-lang') || 'ru'; } catch (e) {}
  [].forEach.call(document.querySelectorAll('[data-l]'), function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-l') === lang ? 'true' : 'false');
    b.addEventListener('click', function () {
      try { localStorage.setItem('foodlab-lang', b.getAttribute('data-l')); } catch (e) {}
      location.reload();
    });
  });
  var sess = null;
  try { sess = JSON.parse(localStorage.getItem('foodlab-session') || 'null'); } catch (e) {}
  if (!sess) app.innerHTML = '<div class="gate"><p>Сначала войдите в Академию.</p><a class="btn" href="Академия.dc.html">← В Академию</a></div>';
  else home();
})();
</script>
</body>
</html>
