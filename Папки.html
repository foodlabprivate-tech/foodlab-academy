<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Должностные папки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--paper:#F5F7F3;--panel:#FFFFFF;--tint:#ECF0EA;--line:#D8DED6;--ink:#17211C;--ink-2:#56625B;--pandan:#2E7D4F;--pandan-bg:#E2EFE6;--terong:#6A4A9C;--terong-bg:#ECE6F5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#101613;--panel:#17201B;--tint:#1D2722;--line:#2C3832;--ink:#E6ECE8;--ink-2:#A3B0A8;--pandan:#6CC08E;--pandan-bg:#1A2E22;--terong:#B79DE6;--terong-bg:#251E33}}
:root[data-theme="dark"]{--paper:#101613;--panel:#17201B;--tint:#1D2722;--line:#2C3832;--ink:#E6ECE8;--ink-2:#A3B0A8;--pandan:#6CC08E;--pandan-bg:#1A2E22;--terong:#B79DE6;--terong-bg:#251E33}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 "Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:28px}
.back{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.back:hover{border-color:var(--ink-2)}
.lang{display:inline-flex;gap:2px;padding:3px;background:var(--tint);border-radius:999px}
.lang button{font:600 12px/1 "Onest",system-ui,sans-serif;color:var(--ink-2);background:transparent;border:0;border-radius:999px;padding:7px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.eyebrow{font:600 12px/1.3 "JetBrains Mono",monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
h1{font:700 clamp(30px,5vw,48px)/1.05 "Unbounded","Arial Black",sans-serif;margin:0 0 12px;letter-spacing:-.01em}
.lead{color:var(--ink-2);font-size:17px;max-width:60ch;margin:0 0 28px}
h2{font:700 13px/1.3 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:16px 16px 14px;min-width:0}
.card:hover{border-color:var(--ink-2);border-left-color:var(--c)}
.card .code{font:600 11px/1 "JetBrains Mono",monospace;color:var(--c);letter-spacing:.06em}
.card b{display:block;font-size:17px;line-height:1.3;margin:6px 0 4px}
.card span{display:block;font-size:14px;color:var(--ink-2)}
.all{--c:var(--pandan)} .lead-c{--c:var(--terong)}
.empty{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="back" href="Академия.dc.html" id="back">← Академия</a>
    <span class="lang" role="group" aria-label="Language"><button type="button" data-l="ru">RU</button><button type="button" data-l="id">ID</button><button type="button" data-l="en">EN</button></span>
  </div>
  <p class="eyebrow">Food Lab Academy</p>
  <h1 id="h1">Должностные папки</h1>
  <p class="lead" id="lead"></p>
  <div id="list"></div>
</div>
<script>
(function () {
  var lang = 'ru';
  try { lang = localStorage.getItem('foodlab-lang') || 'ru'; } catch (e) {}
  if (['ru', 'en', 'id'].indexOf(lang) < 0) lang = 'ru';
  document.documentElement.lang = lang;
  var u = null;
  try { u = JSON.parse(localStorage.getItem('foodlab-session') || 'null'); } catch (e) {}
  var lead = !!u && (u.role === 'admin' || u.role === 'sous' || ['Шеф-повар', 'Су-шеф', 'HR-менеджер'].indexOf(u.position) >= 0);

  var UI = {
    ru: { title: 'Должностные папки', back: '← Академия', lead: 'Сначала изучите Папку сотрудника, потом папку своей должности. Папки открываются на языке, выбранном в Академии.',
          all: 'Для всех сотрудников', mgmt: 'Для руководителей', login: 'Войдите в Академию, чтобы открыть папки.' },
    en: { title: 'Job folders', back: '← Academy', lead: 'Study the Employee folder first, then the folder for your own position. Folders open in the language chosen in the Academy.',
          all: 'For all staff', mgmt: 'For managers', login: 'Sign in to the Academy to open the folders.' },
    id: { title: 'Map jabatan', back: '← Akademi', lead: 'Pelajari Map Karyawan terlebih dahulu, lalu map jabatanmu sendiri. Map dibuka dalam bahasa yang dipilih di Akademi.',
          all: 'Untuk semua karyawan', mgmt: 'Untuk pemimpin', login: 'Masuk ke Akademi untuk membuka map.' }
  };
  var F = [
    { href: 'Папка сотрудника.html', code: 'ALL', lvl: 'all',
      ru: ['Папка сотрудника', 'Общее для всех: компания, оргсхема, оплата, форма, правила, обучение, карьера.'],
      en: ['Employee folder', 'Common to everyone: the company, org board, pay, uniform, rules, training, career.'],
      id: ['Map karyawan', 'Berlaku untuk semua: perusahaan, bagan organisasi, gaji, seragam, aturan, pelatihan, karier.'] },
    { href: 'Папка Cook.html', code: 'COOK', lvl: 'all',
      ru: ['Папка Cook', 'Пост повара: ЦКП, главная статистика, обучение, стандарты смены, ночная смена, рост.'],
      en: ['Cook folder', 'The cook post: product, main statistic, training, shift standards, night shift, growth.'],
      id: ['Map Cook', 'Pos juru masak: produk, statistik utama, pelatihan, standar shift, shift malam, karier.'] },
    { href: 'Папка CDP.html', code: 'CDP', lvl: 'all',
      ru: ['Папка CDP', 'Станция, старший смены, наставничество, пробные смены, оценка и рост.'],
      en: ['CDP folder', 'The station, shift lead, mentoring, trial shifts, evaluation and growth.'],
      id: ['Map CDP', 'Stasiun, kepala shift, mentoring, shift percobaan, penilaian dan karier.'] },
    { href: 'Папка Sous Chef.html', code: 'SC', lvl: 'lead',
      ru: ['Папка Sous Chef', 'Кухня точки: статистика, штат и ФОТ, график, найм, обучение, дисциплина, увольнение.'],
      en: ['Sous Chef folder', 'The outlet kitchen: statistics, staffing and payroll, rota, hiring, training, discipline, dismissal.'],
      id: ['Map Sous Chef', 'Dapur outlet: statistik, tim dan biaya gaji, jadwal, rekrutmen, pelatihan, disiplin, pemberhentian.'] },
    { href: 'Папка Head Chef.html', code: 'HC', lvl: 'lead',
      ru: ['Папка Head Chef', 'Кухни региона: ГС и KPI-бонус, штат и ФОТ, найм руководителей, открытие точек.'],
      en: ['Head Chef folder', 'Regional kitchens: main statistic and KPI bonus, staffing and payroll, hiring managers, opening outlets.'],
      id: ['Map Head Chef', 'Dapur wilayah: statistik utama dan bonus KPI, tim dan biaya gaji, rekrutmen pemimpin, pembukaan outlet.'] },
    { href: 'Введение руководителей.html', code: 'SC · HC', lvl: 'lead',
      ru: ['Введение в должность руководителей', 'Как вводить в должность нового Sous Chef и Head Chef.'],
      en: ['Manager induction', 'How to induct a new Sous Chef and Head Chef into the post.'],
      id: ['Pengenalan jabatan pemimpin', 'Cara memperkenalkan Sous Chef dan Head Chef baru pada jabatannya.'] },
    { href: 'Папка HR-менеджера.html', code: 'HR', lvl: 'lead',
      ru: ['Папка HR-менеджера', 'Оригинал всех HR-инструкций: найм, приём, обучение, контроль, оценка, увольнение, данные.'],
      en: ['HR manager folder', 'The master copy of all HR instructions: hiring, onboarding, training, control, evaluation, dismissal, data.'],
      id: ['Map HR manager', 'Induk semua instruksi HR: rekrutmen, penerimaan, pelatihan, kontrol, penilaian, pemberhentian, data.'] },
    { href: 'HR Playbook.html', code: 'PB-HR', lvl: 'lead',
      ru: ['HR Playbook', 'Стандарт HR для всех точек: штат, оплата, найм, приём, обучение, контроль, оценка, увольнение.'],
      en: ['HR Playbook', 'The HR standard for all outlets: staffing, pay, hiring, onboarding, training, control, evaluation, dismissal.'],
      id: ['HR Playbook', 'Standar HR untuk semua outlet: tim, gaji, rekrutmen, penerimaan, pelatihan, kontrol, penilaian, pemberhentian.'] }
  ];
  var T = UI[lang];
  document.title = T.title;
  document.getElementById('h1').textContent = T.title;
  document.getElementById('back').textContent = T.back;
  document.getElementById('lead').textContent = T.lead;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function group(title, items, cls) {
    if (!items.length) return '';
    return '<h2>' + esc(title) + '</h2><div class="grid">' + items.map(function (f) {
      return '<a class="card ' + cls + '" href="' + encodeURI(f.href) + '"><span class="code">' + esc(f.code) + '</span><b>' + esc(f[lang][0]) + '</b><span>' + esc(f[lang][1]) + '</span></a>';
    }).join('') + '</div>';
  }
  var list = document.getElementById('list');
  if (!u) list.innerHTML = '<p class="empty">' + esc(T.login) + '</p>';
  else list.innerHTML = group(T.all, F.filter(function (f) { return f.lvl === 'all'; }), 'all') +
    (lead ? group(T.mgmt, F.filter(function (f) { return f.lvl === 'lead'; }), 'lead-c') : '');
  [].forEach.call(document.querySelectorAll('[data-l]'), function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-l') === lang ? 'true' : 'false');
    b.addEventListener('click', function () {
      try { localStorage.setItem('foodlab-lang', b.getAttribute('data-l')); } catch (e) {}
      location.reload();
    });
  });
})();
</script>
</body>
</html>
